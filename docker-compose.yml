services:

  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - cms_backend

    healthcheck:
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
   
    volumes:
      - wordpress_data:/var/www/html

    networks:
      - cms_frontend
      - cms_backend

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      PMA_HOST: db
      PMA_PORT: 3306

    ports:
      - "127.0.0.1:8081:80"

    networks:
      - cms_frontend
      - cms_backend

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    container_name: blog-cms-nginx
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - wordpress

    networks:
      - cms_frontend

networks:
  cms_frontend:
    driver: bridge

  cms_backend:
    driver: bridge
    internal: true


volumes:
  mysql_data:
  wordpress_data: