# =====================================
# BLOG CMS - PROMETHEUS CONFIGURATION
# =====================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # 1. Prometheus Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  # 2. Docker Container Monitoring
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  # 3. Nginx Web Server Monitoring
  - job_name: "nginx"
    static_configs:
      - targets:
          - "nginx-exporter:9113"

  # 4. MySQL Database Monitoring
  - job_name: "mysql"
    static_configs:
      - targets:
          - "mysql-exporter:9104"